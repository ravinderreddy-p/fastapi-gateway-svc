apiVersion: apps/v1
kind: Deployment
metadata:
  name: service1
  namespace: my-app-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service1
  template:
    metadata:
      labels:
        app: service1
    spec:
      containers:
        - name: service1
          image: fastapi-gateway-svc-service1:latest
          imagePullPolicy: IfNotPresent # Added image pull policy
---
apiVersion: v1
kind: Service
metadata:
  name: service1
  namespace: my-app-namespace
spec:
  selector:
    app: service1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
