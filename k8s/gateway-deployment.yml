apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: my-app-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: fastapi-gateway-svc-gateway:latest
          ports:
            - containerPort: 8000
          imagePullPolicy: IfNotPresent # Added image pull policy
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: my-app-namespace
spec:
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: LoadBalancer # Expose the service externally
